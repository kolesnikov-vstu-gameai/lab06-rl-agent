[project]
name = "lab06-rl"
version = "0.1.0"
description = "Учебный проект по дисциплине «Игровой ИИ»"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[classic-control,box2d]>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "tensorboard>=2.16",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "moviepy>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
